# Local/full-stack compose. Secrets come from api/.env.staging (not committed) — see README.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: reelty
      POSTGRES_PASSWORD: reelty
      POSTGRES_DB: reelty
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  redis:
    image: redis:7
    # BullMQ requires noeviction (spec §5.2)
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]

  migrate:
    build: { context: ./api, target: migrate }
    env_file: ./api/.env.staging
    environment:
      DATABASE_URL: postgresql://reelty:reelty@postgres:5432/reelty
    depends_on: [postgres]
    restart: "no"

  api:
    build: { context: ./api }
    env_file: ./api/.env.staging
    environment:
      DATABASE_URL: postgresql://reelty:reelty@postgres:5432/reelty
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    ports: ["3000:3000"]
    depends_on: [postgres, redis, migrate]

  app:
    build:
      context: ./app
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
    ports: ["3001:3001"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
